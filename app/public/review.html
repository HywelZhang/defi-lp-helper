<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LP Agent — 复盘</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23c8f751'/><text x='16' y='23' font-size='18' font-family='monospace' text-anchor='middle' fill='%230b0d0a'>L</text></svg>" />
<link rel="stylesheet" href="/app.css" />
<link rel="stylesheet" href="/assets.css" />
<link rel="stylesheet" href="/review.css" />
</head>
<body>
<div class="shell">

  <aside class="rail">
    <div class="brand">
      <div class="brand-mark">L</div>
      <div class="brand-text">
        <div class="brand-name">LP Agent</div>
        <div class="brand-beta">M2 · REVIEW</div>
      </div>
    </div>

    <nav class="nav">
      <a class="nav-item" href="/assistant"><i data-i="spark"></i>AI 助手</a>
      <a class="nav-item" href="/"><i data-i="feed"></i>发现 / Feed<span class="pill">LIVE</span></a>
      <a class="nav-item" href="/leaderboard"><i data-i="grid"></i>榜单</a>
      <a class="nav-item" href="/assets"><i data-i="wallet"></i>我的资产</a>
      <a class="nav-item active" href="/review"><i data-i="book"></i>复盘</a>
      <a class="nav-item" href="/notifications"><i data-i="clock"></i>通知</a>
    </nav>

    <div class="rail-foot">
      <div class="conn"><span class="live-dot"></span><span id="connText">已连接</span></div>
      <div class="rail-meta">链 <span id="chainName">X Layer</span></div>
      <div class="rail-user">
        <span id="userName">—</span>
        <button id="btnLogout" class="logout" title="退出登录">退出</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb">
        <span>工作空间</span><span class="sep">/</span><span class="crumb-cur">复盘</span>
      </div>
      <div class="top-actions">
        <button class="btn ghost" id="btnStyle"><i data-i="refresh"></i>重新总结风格</button>
      </div>
    </header>

    <div class="scroll" id="scroll">

      <!-- style banner: whether reviews currently influence recommendations -->
      <section class="rv-stylebar" id="styleBar"></section>

      <!-- tabs -->
      <nav class="rv-tabs" id="tabs">
        <button class="rv-tab active" data-tab="position">单笔仓位</button>
        <button class="rv-tab" data-tab="period">阶段性</button>
        <button class="rv-tab" data-tab="style">交易风格</button>
      </nav>

      <!-- position scope -->
      <section class="rv-pane active" data-pane="position">
        <div class="rv-controls">
          <label class="rv-field">
            <span>选择仓位</span>
            <select id="posSelect"><option value="">加载中…</option></select>
          </label>
          <button class="btn primary" id="btnPosReview">生成复盘</button>
        </div>
        <div id="posOut"></div>
      </section>

      <!-- period scope -->
      <section class="rv-pane" data-pane="period">
        <div class="rv-controls">
          <label class="rv-field">
            <span>统计区间</span>
            <select id="periodSel">
              <option value="7">最近 7 天</option>
              <option value="30">最近 30 天</option>
              <option value="90">最近 90 天</option>
            </select>
          </label>
          <button class="btn primary" id="btnPeriodReview">生成复盘</button>
        </div>
        <div id="periodOut"></div>
      </section>

      <!-- style scope -->
      <section class="rv-pane" data-pane="style">
        <div id="styleOut"></div>
      </section>

      <!-- history -->
      <section class="dsec" style="margin-top:26px">
        <div class="dsec-title">历史复盘 <span class="panel-count" id="histCount"></span></div>
        <div id="history"></div>
      </section>

    </div>
  </main>
</div>

<script src="/review.js" type="module"></script>
</body>
</html>
